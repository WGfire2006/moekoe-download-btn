<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全屏显示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
        }
        iframe:focus-visible {
            outline: none;
        }
        iframe::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://wgfire.top" 
        allowfullscreen
    ></iframe>
</body>
</html>
